name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege: every job only reads the repository. Anything that needs more (PR
# comments) lives in bench.yml with its own scoped permissions.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail loudly instead of silently rewriting go.mod/go.sum while checking the tree.
  GOFLAGS: -mod=readonly

jobs:
  build:
    name: build + vet (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod declares `go 1.27.0`. 1.27 is the declared minimum; the 1.26 row proves the
        # module still resolves for users on an older local toolchain (GOTOOLCHAIN defaults
        # to `auto`, so a 1.26 binary downloads the 1.27.x toolchain).
        go: ["1.26", "1.27"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: Download modules
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # Informational until the module owner tidies go.sum (it currently carries stale
      - name: go.mod/go.sum tidy (blocking)
        run: go mod tidy -diff

  test:
    name: test -race (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: Test with race detector, shuffled, coverage
        run: go test -race -shuffle=on -count=1 -covermode=atomic -coverprofile=coverage.txt ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.txt | tail -n 1
      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage-go${{ matrix.go }}
          path: coverage.txt
          if-no-files-found: error
          retention-days: 7

  lint:
    name: lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve tool versions
        id: tools
        # Single source of truth: tools-versions.txt. Renovate updates that file only.
        run: |
          echo "golangci_lint=$(awk '$1=="golangci-lint"{print $2}' tools-versions.txt)" >> "$GITHUB_OUTPUT"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.tools.outputs.golangci_lint }}
          args: --timeout=5m

  security:
    name: security (gosec + govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve pinned tool versions
        id: tools
        run: |
          {
            echo "gosec=$(awk '$1=="gosec"{print $2}' tools-versions.txt)"
            echo "govulncheck=$(awk '$1=="govulncheck"{print $2}' tools-versions.txt)"
          } >> "$GITHUB_OUTPUT"
      - name: gosec
        run: |
          go install "github.com/securego/gosec/v2/cmd/gosec@${{ steps.tools.outputs.gosec }}"
          "$(go env GOPATH)/bin/gosec" -quiet -fmt=text ./...
      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${{ steps.tools.outputs.govulncheck }}"
          "$(go env GOPATH)/bin/govulncheck" ./...

  budget:
    name: allocation budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # scripts/check_alloc.sh runs both allocation-budget tests (alloc_test.go is the
      # canonical gate per DESIGN §6; fuzz/budget_test.go re-asserts it through the public
      # API) and fails closed if either test is missing.
      - name: Allocation ceilings (docs/DESIGN.md §6)
        run: ./scripts/check_alloc.sh

  benchmark:
    name: benchmark smoke (informational)
    runs-on: ubuntu-latest
    # Shared runners are too noisy for benchmark gating; bench.yml reports the deltas and the
    # budget job gates allocations. This job only proves the benchmarks still run.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run benchmarks once
        run: go test -run '^$' -bench . -benchmem -count=3 -p 1 ./...

  integration:
    name: integration (postgres, allowed to fail)
    runs-on: ubuntu-latest
    # Postgres-backed integration tests are allowed to fail so an unavailable service or a
    # Docker-less runner never blocks the release train; failures still show as annotations.
    continue-on-error: true
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: rql
          POSTGRES_PASSWORD: rql
          POSTGRES_DB: rql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rql -d rql_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_DSN: postgres://rql:rql@127.0.0.1:5432/rql_test?sslmode=disable
      RQL_TEST_POSTGRES_DSN: postgres://rql:rql@127.0.0.1:5432/rql_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Integration tests (nested module, real Postgres)
        working-directory: test/integration
        run: go test -count=1 -race ./...
